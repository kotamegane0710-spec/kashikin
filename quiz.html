    "explanation": "②が適切でありません。会社計算規則上、負債の部は流動負債及び固定負債に区分するものとされ、「引当金その他の負債」という区分は規定されていません。\n①、③、④はいずれも会社計算規則及び貸借対照表の基本構造として正しい記述です。\n\nよって②が正解です。"
   }
  ]
 }
];

/* ===================== アプリ本体 ===================== */

const CATEGORIES = [
  "法及び関係法令に関すること",
  "貸付け及び貸付けに付随する取引に関する法令及び実務に関すること",
  "資金需要者等の保護に関すること",
  "財務及び会計に関すること"
];

let state = {
  view: "home",       // home / roundList / categoryList / quiz / result
  mode: null,          // "round" or "category"
  quizQuestions: [],   // 現在解いている問題配列
  quizTitle: "",
  current: 0,
  answers: {},          // { qIndex: {selected, correct} }
};

const app = document.getElementById("app");

function render(){
  app.innerHTML = "";
  if(state.view === "home") renderHome();
  else if(state.view === "roundList") renderRoundList();
  else if(state.view === "categoryList") renderCategoryList();
  else if(state.view === "quiz") renderQuiz();
  else if(state.view === "result") renderResult();
}

function el(html){
  const d = document.createElement("div");
  d.innerHTML = html;
  return d.firstElementChild;
}

function renderHome(){
  const totalQ = EXAMS.reduce((s,e)=>s+e.questions.length,0);
  const wrap = el(`
    <div>
      <div class="card">
        <p style="margin:0 0 8px;color:var(--muted);font-size:.85rem;">
          現在登録済み：${EXAMS.length}回分 / 全${totalQ}問
        </p>
        <div style="display:flex;gap:8px;">
          <button id="btnRound" style="flex:1;padding:14px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-weight:bold;font-size:.95rem;">回ごとに解く</button>
          <button id="btnCategory" style="flex:1;padding:14px;border-radius:8px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-weight:bold;font-size:.95rem;">分野ごとに解く</button>
        </div>
      </div>
      <div class="card">
        <h4 style="margin:0 0 6px;color:var(--navy);">使い方</h4>
        <p style="font-size:.82rem;color:var(--muted);line-height:1.7;margin:0;">
          「回ごとに解く」ではその回の問題を通しで、「分野ごとに解く」では全ての回から同じ分野の問題だけを抜き出して解けます。
          問題を選ぶと選択肢が表示され、選んだ瞬間に正解・不正解と解説が表示されます。
        </p>
      </div>
    </div>
  `);
  wrap.querySelector("#btnRound").onclick = ()=>{state.view="roundList";state.mode="round";render();};
  wrap.querySelector("#btnCategory").onclick = ()=>{state.view="categoryList";state.mode="category";render();};
  app.appendChild(wrap);
}

function renderRoundList(){
  const wrap = el(`<div><span class="back-link" id="back">← ホームへ戻る</span><div id="list"></div></div>`);
  wrap.querySelector("#back").onclick = ()=>{state.view="home";render();};
  const list = wrap.querySelector("#list");
  if(EXAMS.length===0){
    list.appendChild(el(`<div class="empty-note">まだ回のデータがありません。</div>`));
  }
  const sortedExams = [...EXAMS].sort((a,b)=>(a.round||0)-(b.round||0));
  sortedExams.forEach(exam=>{
    const roundLabel = exam.round ? `第${exam.round}回　` : "";
    const item = el(`
      <div class="list-item">
        <div>
          <div style="font-weight:bold;">${roundLabel}${exam.title}</div>
          <div class="stat">全${exam.questions.length}問</div>
        </div>
        <span class="badge">解く &rarr;</span>
      </div>
    `);
    item.onclick = ()=>startQuiz(exam.questions, `${roundLabel}${exam.title}`);
    list.appendChild(item);
  });
  app.appendChild(wrap);
}

function renderCategoryList(){
  const wrap = el(`<div><span class="back-link" id="back">← ホームへ戻る</span><div id="list"></div></div>`);
  wrap.querySelector("#back").onclick = ()=>{state.view="home";render();};
  const list = wrap.querySelector("#list");
  CATEGORIES.forEach(cat=>{
    const qs = [];
    EXAMS.forEach(exam=>{
      exam.questions.forEach(q=>{
        if(q.category===cat) qs.push({...q, _round: (exam.round?`第${exam.round}回　`:"")+exam.title});
      });
    });
    const item = el(`
      <div class="list-item">
        <div>
          <div style="font-weight:bold;font-size:.9rem;">${cat}</div>
          <div class="stat">全${qs.length}問（全回通算）</div>
        </div>
        <span class="badge">解く &rarr;</span>
      </div>
    `);
    item.onclick = ()=>startQuiz(qs, cat);
    list.appendChild(item);
  });
  app.appendChild(wrap);
}

function startQuiz(questions, title){
  if(questions.length===0){
    alert("この分類にはまだ問題がありません。");
    return;
  }
  state.quizQuestions = questions;
  state.quizTitle = title;
  state.current = 0;
  state.answers = {};
  state.view = "quiz";
  render();
}

function renderQuiz(){
  const q = state.quizQuestions[state.current];
  const total = state.quizQuestions.length;
  const answered = state.answers[state.current];

  const wrap = el(`
    <div>
      <span class="back-link" id="back">← 一覧へ戻る</span>
      <div class="progress-bar"><div style="width:${((state.current+1)/total*100).toFixed(0)}%"></div></div>
      <p style="font-size:.75rem;color:var(--muted);margin:6px 0 0;">${state.quizTitle}　${state.current+1} / ${total}問</p>
      <div class="card" style="margin-top:10px;">
        <div class="q-header">
          <span class="qnum">問${q.no ?? (state.current+1)}${q._round ? "（"+q._round+"）":""}</span>
          <span class="qcat">${q.category||""}</span>
        </div>
        <div class="q-text">${highlightBlanks(escapeHtml(q.text))}</div>
        <div id="choices"></div>
        <div id="feedback"></div>
      </div>
      <div class="nav-buttons">
        <button class="secondary" id="prevBtn" ${state.current===0?"disabled":""}>← 前の問題</button>
        <button id="nextBtn" ${state.current===total-1?"":""}>${state.current===total-1?"結果を見る":"次の問題 →"}</button>
      </div>
    </div>
  `);

  wrap.querySelector("#back").onclick = ()=>{state.view = state.mode==="round" ? "roundList":"categoryList"; render();};
  wrap.querySelector("#prevBtn").onclick = ()=>{state.current--; render();};
  wrap.querySelector("#nextBtn").onclick = ()=>{
    if(state.current===total-1){ state.view="result"; render(); }
    else { state.current++; render(); }
  };

  const choicesDiv = wrap.querySelector("#choices");
  const feedbackDiv = wrap.querySelector("#feedback");

  q.choices.forEach((choiceText, idx)=>{
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerText = choiceText;
    if(answered){
      btn.classList.add("disabled");
      if(idx===answered.selected && answered.selected===q.answer) btn.classList.add("correct");
      else if(idx===answered.selected && answered.selected!==q.answer) btn.classList.add("incorrect");
      else if(idx===q.answer) btn.classList.add("correct");
      else btn.classList.add("dim");
    }
    btn.onclick = ()=>{
      if(state.answers[state.current]) return; // 既に回答済み
      if(q.answer===null || q.answer===undefined){
        alert("この問題はまだ正解が設定されていません。正解番号を教えてください。");
        return;
      }
      state.answers[state.current] = {selected: idx, correct: idx===q.answer};
      render();
    };
    choicesDiv.appendChild(btn);
  });

  if(answered){
    const isCorrect = answered.correct;
    feedbackDiv.appendChild(el(`
      <div class="result-banner ${isCorrect?"correct":"incorrect"}">${isCorrect?"◯ 正解です":"✕ 不正解です"}</div>
    `));
    feedbackDiv.appendChild(el(`
      <div class="explanation">
        <h4>解説</h4><div class="explanation-body">${escapeHtml(q.explanation || "（この問題の解説はまだ作成されていません）")}</div>
      </div>
    `));
  }

  app.appendChild(wrap);
}

function renderResult(){
  const total = state.quizQuestions.length;
  let correctCount = 0;
  const grid = [];
  for(let i=0;i<total;i++){
    const a = state.answers[i];
    if(a){
      if(a.correct) correctCount++;
      grid.push(`<div class="${a.correct?"ok":"ng"}" data-i="${i}">${state.quizQuestions[i].no ?? i+1}</div>`);
    } else {
      grid.push(`<div class="unanswered" data-i="${i}">${state.quizQuestions[i].no ?? i+1}</div>`);
    }
  }
  const answeredCount = Object.keys(state.answers).length;

  const wrap = el(`
    <div>
      <span class="back-link" id="back">← 一覧へ戻る</span>
      <div class="card">
        <div class="score-big">${correctCount} / ${answeredCount}</div>
        <div class="score-sub">${state.quizTitle}（回答済み ${answeredCount} / 全${total}問）</div>
        <div class="summary-grid">${grid.join("")}</div>
        <p style="font-size:.75rem;color:var(--muted);text-align:center;">番号をタップするとその問題に戻れます</p>
      </div>
      <button id="retryBtn" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-weight:bold;">この回をもう一度解く</button>
    </div>
  `);
  wrap.querySelector("#back").onclick = ()=>{state.view = state.mode==="round" ? "roundList":"categoryList"; render();};
  wrap.querySelector("#retryBtn").onclick = ()=>{
    state.answers = {};
    state.current = 0;
    state.view = "quiz";
    render();
  };
  wrap.querySelectorAll(".summary-grid div").forEach(d=>{
    d.onclick = ()=>{ state.current = parseInt(d.dataset.i); state.view="quiz"; render(); };
  });

  app.appendChild(wrap);
}

function escapeHtml(str){
  if(!str) return "";
  return str
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/\n/g,"<br>");
}

function highlightBlanks(escapedStr){
  return escapedStr.replace(/（\s*([アイウエオａｂｃｄ])\s*）/g, '<span class="blank-marker">（$1）</span>');
}

render();

// PWA: サービスワーカー登録（オフラインでも動作するように）
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {
      // 登録に失敗してもアプリ自体は通常のWebページとして動作する
    });
  });
}
</script>
</body>
</html>
